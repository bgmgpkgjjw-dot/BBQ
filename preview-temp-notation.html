<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Temp notation preview</title>
<link rel="stylesheet" href="styles.css">
<style>
    body { background: #1b140d; padding: 40px; display: flex; gap: 40px; flex-wrap: wrap; font-family: sans-serif; }
    .temp-decimal { font-size: 0.5em; font-weight: 600; opacity: 0.7; }
    .label { color: #ccc; text-align: center; margin-top: 8px; font-size: 13px; }
    .box { border: 1px dashed #555; padding: 16px; border-radius: 8px; }
</style>
</head>
<body>

    <div class="box">
        <div class="gauge-circle">
            <div class="gauge-value">84<span class="temp-decimal">.3</span>°</div>
        </div>
        <div class="label">Dome gauge — PROPOSED<br>(main digits 42px, decimal ~21px)</div>
    </div>

    <div class="box">
        <div class="gauge-circle">
            <div class="gauge-value">84.3°</div>
        </div>
        <div class="label">Dome gauge — CURRENT<br>(all digits 42px, no split)</div>
    </div>

    <div class="box">
        <div class="thermometer-value">94<span class="temp-decimal">.7</span>°</div>
        <div class="label">Meat probe — PROPOSED</div>
    </div>

    <div class="box">
        <div class="thermometer-value">94.7°</div>
        <div class="label">Meat probe — CURRENT</div>
    </div>

</body>
</html>
